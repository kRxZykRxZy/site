<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="/manifest.json"><title>Pi Guardian</title><style>*{box-sizing:border-box}body{margin:0;background:#080d17;color:#e8eef8;font:15px system-ui,-apple-system,sans-serif}header{height:64px;border-bottom:1px solid #1d293b;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#0b1220;position:sticky;top:0}.brand{font-weight:700;font-size:19px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#31d17c;margin-right:8px}.wrap{max-width:1100px;margin:auto;padding:22px}.login{max-width:390px;margin:12vh auto;background:#0e1726;border:1px solid #1d293b;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0005}h1,h2{margin-top:0}input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #26364d;background:#0a111d;color:#fff;margin:6px 0;font:inherit}button{cursor:pointer;background:#315efb;border:0;font-weight:650}.error{color:#ff6b6b;min-height:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#0e1726;border:1px solid #1d293b;border-radius:15px;padding:18px}.value{font-size:30px;font-weight:750;margin-top:8px}.muted{color:#8796aa}.nav{display:flex;gap:8px;margin:18px 0;overflow:auto}.nav button{width:auto;background:#111d30}.danger{background:#9f2f3b}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.hidden{display:none}.notice{padding:12px;border:1px solid #25354b;border-radius:10px;margin-top:12px}.critical{border-color:#8d303b}small{color:#7f8ea2}</style></head><body><header><div class="brand"><span class="dot"></span>Pi Guardian</div><button id="logout" class="hidden" style="width:auto;padding:8px 14px">Logout</button></header><main class="wrap"><section id="login" class="login"><h1>Sign in</h1><p class="muted">Authenticate to manage this Raspberry Pi.</p><form id="form"><input id="user" autocomplete="username" placeholder="Username" required><input id="pass" type="password" autocomplete="current-password" placeholder="Password" required><button>Sign in</button><div id="err" class="error"></div></form></section><section id="app" class="hidden"><div class="row"><div><h1>Overview</h1><div class="muted">Live infrastructure health</div></div><button id="push" style="width:auto">Enable notifications</button></div><div class="nav"><button onclick="load()">Overview</button><button onclick="alert('Service management module is enabled in the daemon API.')">Services</button><button onclick="alert('Event history is written to /var/log/pi-guardian.log.')">Events</button><button onclick="alert('Guardian settings are configured at install time in this build.')">Settings</button></div><div class="grid"><div class="card"><div class="muted">CPU</div><div id="cpu" class="value">—</div></div><div class="card"><div class="muted">Memory</div><div id="ram" class="value">—</div></div><div class="card"><div class="muted">Disk</div><div id="disk" class="value">—</div></div><div class="card"><div class="muted">Temperature</div><div id="temp" class="value">—</div></div></div><div class="card" style="margin-top:14px"><h2>Guardian</h2><div class="notice"><b>Automatic protection enabled</b><br><small>Threshold checks run continuously. Critical conditions are recorded and can trigger notifications.</small></div><div id="state" class="notice">Connecting…</div></div></section></main><script>const $=id=>document.getElementById(id);async function api(url,opt){return fetch(url,opt)}async function load(){let r=await api('/api/status');if(r.status===401)return showLogin();let d=await r.json();$('cpu').textContent=d.cpu+'%';$('ram').textContent=d.ram+'%';$('disk').textContent=d.disk+'%';$('temp').textContent=d.temp+'°C';$('state').textContent='Guardian online · port '+d.port}function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');load()}function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden')}$('form').onsubmit=async e=>{e.preventDefault();$('err').textContent='';let body='username='+encodeURIComponent($('user').value)+'&password='+encodeURIComponent($('pass').value);let r=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(r.ok)showApp();else $('err').textContent='Invalid username or password.'};$('logout').onclick=async()=>{await api('/api/logout');showLogin()};$('push').onclick=async()=>{if(!('Notification'in window)){alert('Notifications are not supported by this browser.');return}let p=await Notification.requestPermission();$('push').textContent=p==='granted'?'Notifications enabled':'Notifications blocked'};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();setInterval(load,10000)</script></body></html>
