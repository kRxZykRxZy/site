<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Project</title>
  <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body>
  <h1>Project {{ project_id }}</h1>
  <iframe id="project-frame" style="width:100%;height:80vh;border:0"></iframe>
  <script>
    async function load() {
      const res = await fetch('/api/projects/' + {{ project_id }});
      const body = await res.json();
      const htmlFile = body.files.find(f => f.path.endsWith('.html'));
      if (htmlFile) {
        const fileRes = await fetch('/api/projects/' + {{ project_id }} + '/files/raw/' + encodeURIComponent(htmlFile.path));
        const fileBody = await fileRes.json();
        const blob = new Blob([fileBody.content], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        document.getElementById('project-frame').src = url;
      }
    }
    load();
  </script>
</body>
</html>
