version: "3.8"
services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/codetorch.db
      - SECRET_KEY=devsecret
    depends_on: []
  worker:
    build: .
    command: python -m app.cli worker
    volumes:
      - ./:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/codetorch.db
      - SECRET_KEY=devsecret
